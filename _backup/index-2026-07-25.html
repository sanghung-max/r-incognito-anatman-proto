<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無道啟示錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-viewport">
  <!-- Main Stage Area (Breadcrumb + Content Stacked) -->
  <div id="main-stage" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    
   <!-- HEADER BAR: BREADCRUMBS & TOP FIND ELEMENT -->
<div class="header-bar">
  <div id="breadcrumb-container" style="flex: 1;"></div>
  
  <!-- Minimalist Search Icon Button (No label, no box outline) -->
  <button id="find-toggle-btn" class="find-icon-btn" onclick="toggleFindDropdown()" aria-label="Search and Filter">
  <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</button>

  <!-- Persistent Search Dropdown Overlay -->
  <div id="find-dropdown-panel" class="find-dropdown-panel hidden">
    <div class="filter-group">
      <label for="filter-language">Language</label>
      <select id="filter-language" onchange="handleFilterChange()">
        <option value="all">All Languages</option>
        <option value="en">English (EN)</option>
        <option value="zh">Chinese (ZH)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-board">Board</label>
      <select id="filter-board" onchange="handleBoardFilterChange()">
        <option value="all">All Boards</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-subcategory">Subcategory</label>
      <select id="filter-subcategory" onchange="handleFilterChange()">
        <option value="all">All Subcategories</option>
      </select>
    </div>

    <!-- Media Type moved to the bottom -->
    <div class="filter-group">
      <label for="filter-media-type">Media Type</label>
      <select id="filter-media-type" onchange="handleFilterChange()">
        <option value="all">All Types</option>
        <option value="pdf">PDF Document</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="audio">Audio</option>
      </select>
    </div>
  </div>
</div>

    <!-- Left Main Dynamic Stage Viewport Container -->
    <main id="archive-container" style="flex: 1;"></main>
    
  </div>

  <!-- Right Workspace Drawer Panel -->
  <aside id="expert-side-nav" class="side-nav-hidden">
    <div class="sidebar-sticky-content">
      <!-- Drawer Extent Controls -->
      <div id="drawer-width-controls" class="drawer-controls" style="display: none;">
        <button class="drawer-btn" onclick="setDrawerWidth('standard')">Standard</button>
        <button class="drawer-btn" onclick="setDrawerWidth('wide')">Wide</button>
        <button class="drawer-btn" onclick="setDrawerWidth('full')">Full Focus</button>
      </div>

      <div class="nav-tabs">
        <button class="tab-btn active">Vista</button>
        <button class="tab-btn">Text</button>
        <button class="tab-btn">Epoche</button>
        <button class="tab-btn">Wissen</button>
      </div>
      <div class="tab-display-pane">
        <p class="muted-notice">Select an entry or enter subcategory space to stream metadata...</p>
      </div>
    </div>
  </aside>
</div>

  <!-- Runtime Assets -->
  <script src="js/archive_data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/media.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  
</body>
</html>
